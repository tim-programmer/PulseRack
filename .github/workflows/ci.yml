# Builds and tests PulseRack on Linux (GCC and clang) and Windows (MSVC) with the CMake presets (CMakePresets.json).
# PulseCoreLib, gpuic and libremidi are fetched by CMake; gpuic's own dependencies (SDL3, FreeType, HarfBuzz, FriBidi)
# are downloaded at the versions it pins (PULSERACK_GPUIC_DEPENDENCIES=FETCH, the default).
#
# The window tests draw with OpenGL 3.3 and the runners have no GPU: Mesa's software renderer (llvmpipe) stands in on
# both, under Xvfb on Linux and on the runner's own desktop on Windows.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: linux-${{ matrix.preset }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # (a cold build takes about 4 minutes)
    strategy:
      fail-fast: false
      matrix:
        preset: [release, release-clang]

    steps:
      - uses: actions/checkout@v5

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build clang pkg-config python3 \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdrm-dev libgbm-dev libgl-dev libegl-dev libpng-dev \
            xvfb xauth libgl1-mesa-dri libglx-mesa0 libegl-mesa0 \
            fonts-noto-core fonts-noto-mono fonts-noto-cjk fonts-noto-color-emoji fonts-dejavu-core libasound2-dev \
            libfreetype6-dev libharfbuzz-dev libfribidi-dev libudev-dev

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        env:
          SDL_VIDEO_DRIVER: x11
          LIBGL_ALWAYS_SOFTWARE: "1"
        # (two at a time: the tests draw on the CPU here, and some of them time what they do)
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ctest --preset ${{ matrix.preset }} -j 2 --output-on-failure

      - name: Upload the test log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-log-linux-${{ matrix.preset }}
          path: out/${{ matrix.preset }}/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  windows:
    name: windows-release-msvc
    runs-on: windows-latest
    timeout-minutes: 45 # (gpuic's dependencies make a cold build about 10-15 minutes)

    steps:
      - uses: actions/checkout@v5

      # cl, link and the Windows SDK on the PATH, for Ninja (windows-latest already has CMake, Ninja and VS 2022)
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset release-msvc

      # (-k 0: every file that fails is reported, not only the first)
      - name: Build
        run: cmake --build --preset release-msvc -- -k 0

      # Windows' own software OpenGL is 1.1: Mesa's llvmpipe, installed system-wide, is the counterpart of
      # LIBGL_ALWAYS_SOFTWARE on Linux.
      - name: Install Mesa (software OpenGL)
        uses: ssciwr/setup-mesa-dist-win@v3

      - name: Test
        run: ctest --preset release-msvc -j 2 --output-on-failure

      - name: Upload the test log
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-log-windows-release-msvc
          path: out/release-msvc/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
